<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Savings</title>
  <link rel="stylesheet" href="./bank.css">
</head>
<body>
  <header><strong>Savings</strong><button id="sign-out" class="secondary" hidden>Sign out</button></header>
  <main>
    <p id="loading" role="status">Loading your account…</p>
    <section id="auth" class="card" hidden>
      <h1>Sign in</h1>
      <button id="google-login" type="button">Continue with Google</button>
      <hr>
      <form id="credentials">
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <label>Password<input name="password" type="password" minlength="8" maxlength="128" required></label>
        <div class="actions"><button value="login">Sign in</button><button value="create" class="secondary">Create account</button></div>
      </form>
    </section>
    <section id="profile" class="card" hidden>
      <h1>Set up your account</h1>
      <form id="profile-form">
        <label>Full name<input name="name" autocomplete="name" maxlength="100" required></label>
        <label>Email<input name="email" type="email" readonly></label>
        <label>Phone number<input name="phone" type="tel" autocomplete="tel" maxlength="25" required></label>
        <label>Account number<input name="number" inputmode="numeric" pattern="[0-9]{4,20}" required></label>
        <label>Address<input name="address" autocomplete="street-address" maxlength="250" required></label>
        <label>Account type<select name="type"><option value="savings">Savings</option><option value="current">Current</option></select></label>
        <label>Initial deposit (INR)<input name="initial" inputmode="decimal" value="0" pattern="[0-9]{1,9}(\.[0-9]{1,2})?" required></label>
        <label>Username<input name="username" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" required></label>
        <label>PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" autocomplete="new-password" required></label>
        <button>Save account</button>
      </form>
    </section>
    <p id="account-status" class="status" role="status"></p>
    <section id="dashboard" hidden>
      <h1>Your savings</h1>
      <div class="card balance"><p>Available demo balance</p><output id="balance"></output></div>
      <section class="card">
        <h2>Move money</h2>
        <form id="money-form">
          <label>Amount (INR)<input name="amount" inputmode="decimal" placeholder="0.00"
            pattern="[0-9]{1,9}(\.[0-9]{1,2})?" required></label>
          <label>PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" required></label>
          <div class="actions">
            <button name="action" value="deposit">Deposit</button>
            <button name="action" value="withdraw" class="secondary">Withdraw</button>
          </div>
          <p id="money-status" class="status" role="status"></p>
        </form>
      </section>
      <section class="card">
        <h2>Account details</h2>
        <dl>
          <dt>Full name</dt><dd id="account-name"></dd>
          <dt>Email</dt><dd id="account-email"></dd>
          <dt>Phone number</dt><dd id="account-phone"></dd>
          <dt>Account number</dt><dd id="account-number"></dd>
          <dt>Address</dt><dd id="account-address"></dd>
          <dt>Account type</dt><dd id="account-type"></dd>
          <dt>Username</dt><dd id="account-username"></dd>
          <dt>Customer ID</dt><dd id="account-customerId"></dd>
        </dl>
      </section>
      <section class="card">
        <h2>Settings</h2>
        <form id="settings-form">
          <label>Set demo balance (INR)<input name="amount" inputmode="decimal" pattern="[0-9]{1,9}(\.[0-9]{1,2})?" required></label>
          <label>PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" required></label>
          <button>Save balance</button>
        </form>
        <hr>
        <form id="delete-form">
          <label id="delete-password" hidden>Current password<input name="password" type="password" autocomplete="current-password"></label>
          <button class="secondary">Delete account</button>
        </form>
        <p id="settings-status" class="status" role="status"></p>
      </section>
    </section>
  </main>
  <script type="module" src="./bank.js"></script>
</body>
</html>
